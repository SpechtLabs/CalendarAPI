# Codecov fails a pull request only when coverage falls below 85%, for the
# whole project or for the lines the pull request changes. Without this,
# both targets default to the base branch's own coverage, so a change with
# 95% patch coverage is flagged whenever main happens to sit higher.
coverage:
  status:
    project:
      default:
        target: 85%
    patch:
      default:
        target: 85%

# The Go module lives in src/, but coverage.txt names files by import path
# (github.com/SpechtLabs/CalendarAPI/...), which this maps onto the
# repository.
fixes:
  - "github.com/SpechtLabs/CalendarAPI/::src/"

# Generated from protos/calendar.proto, and main only calls cmd.Execute.
ignore:
  - "src/pkg/protos/**"
  - "src/main.go"
