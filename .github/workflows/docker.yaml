name: Docker

# The container image, built for linux/amd64 and linux/arm64 from the
# Dockerfile, which compiles calendarapi itself. ci.yaml builds it for pull
# requests without pushing; release.yaml pushes :main for every push to main
# and the version tags for every release.
on:
  workflow_call:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false
      ref:
        description: The ref to build; the triggering commit when empty
        type: string
        default: ""
      version:
        description: The version calendarapi reports
        type: string
        default: dev
      tags:
        description: docker/metadata-action tag rules, one per line
        type: string
        default: type=ref,event=pr
  workflow_dispatch:

# No permissions block: a called workflow can only narrow the token its caller
# grants, and release.yaml grants packages: write for the push while ci.yaml
# grants contents: read for a build that doesn't push.

env:
  IMAGE: ghcr.io/spechtlabs/calendarapi

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags || 'type=ref,event=pr' }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # The commit the image is built from, which is the tag's for a release.
      - name: Commit and date
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "date=$(git log -1 --format=%cI)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ inputs.version || 'dev' }}
            COMMIT=${{ steps.commit.outputs.sha }}
            DATE=${{ steps.commit.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
