repos:
  # golint-sl's own hook runs custom-gcl at the repository root, which has no
  # go.mod here; the mise tasks run it in src/ instead.
  - repo: local
    hooks:
      - id: golint-sl
        name: golint-sl
        entry: bash -c 'mise run lint-build && mise run go-lint'
        language: system
        types: [go]
        pass_filenames: false

  # Generic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: mixed-line-ending
      - id: check-added-large-files
        name: check for added large files
        description: Prevents giant files from being committed
        args: ["--maxkb=500"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Runs the mise-pinned actionlint (and shellcheck) rather than a copy
  # pre-commit would build, so the hook and CI agree on the version.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
