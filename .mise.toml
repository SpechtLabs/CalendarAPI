# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how CalendarAPI is built and checked. CI uses these
# tasks. Renovate keeps every pin in this file current.
#
# The Go module lives in src/, so every Go task runs there.

# mise reads the go directive of the nearest go.mod as the Go version to use,
# so inside src/ it would run that minimum version rather than the one pinned
# below. Every tool comes from this file only.
[settings]
idiomatic_version_file_enable_tools = []

[tools]
# Keep in lockstep with the golang build image in the Dockerfile; Renovate
# bumps them together. The go directive in src/go.mod is the minimum version,
# bumped by hand; it is 1.27.1 rather than 1.27 because go-otel-utils
# requires 1.27.1.
go = "1.27.2"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Release tooling
goreleaser = "2.18.2"
cosign = "3.1.3"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Documentation website (docs/): VuePress builds under bun, and
# markdownlint-cli2 is the same version the docs workflow runs. bun also runs
# .github/commit-lint, the squash commit message check in pr-hygiene.yaml.
bun = "1.4.2"
markdownlint-cli2 = "0.23.3"
# markdownlint-cli2 is an npm package, which mise installs with this node.
node = "24.21.0"

[tasks.build]
description = "Build the calendarapi binary into bin/"
dir = "src"
run = "go build -o ../bin/calendarapi ."

[tasks.test]
description = "Run the test suite with race detector and coverage"
dir = "src"
run = "go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./..."

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file. The steps run in
# order, because go mod tidy may rewrite go.mod.
[tasks.fmt]
description = "Format everything: go.mod, Go sources and Markdown"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
  { task = "md-fmt" },
]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
dir = "src"
run = "go mod tidy"

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
dir = "src"
run = "golangci-lint fmt --config ../.golangci.yaml"

[tasks.md-fmt]
description = "Fix what markdownlint can fix in the documentation"
run = "markdownlint-cli2 --fix 'docs/**/*.md'"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

# GoReleaser builds the tagged tree as it is, so an untidy go.mod has to fail
# CI rather than be fixed up at release time.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
dir = "src"
run = "go mod tidy -diff"

[tasks.lint]
description = "Lint the Go module with golangci-lint and golint-sl, YAML and workflows"
depends = ["lint-build", "yaml-lint", "actionlint"]
run = [{ task = "go-lint" }]

# go-lint runs a custom-gcl that's already built; CI's cached path calls it
# directly.
[tasks.go-lint]
description = "Lint the Go module with the custom-gcl binary lint-build wrote"
dir = "src"
run = "../custom-gcl run --config ../.golangci.yaml ./..."

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks.snapshot]
description = "Build a local GoReleaser snapshot into dist/"
run = "goreleaser build --snapshot --clean"

# The image CI builds, for the local platform; see the Dockerfile.
[tasks.image]
description = "Build the container image for the local platform as calendarapi:dev"
run = "docker buildx build --load -t calendarapi:dev ."

[tasks.check]
description = "The definition of done: every gate CI runs on the Go code"
depends = [
  "lint",
  "mod-tidy",
  "test",
  "release-check",
]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"

[tasks.docs-lint]
description = "Lint the documentation markdown (the docs workflow's first job)"
run = "markdownlint-cli2 'docs/**/*.md'"

[tasks.docs-dev]
description = "Serve the documentation website locally with hot reload"
dir = "docs"
run = "bun install && bun run dev"

# vuepress exits 0 when the theme config fails to load and writes no pages,
# so the task checks that it wrote the home page.
[tasks.docs-build]
description = "Build the documentation website (the docs workflow's second job)"
dir = "docs"
run = [
  "bun install --frozen-lockfile",
  "bun run build",
  "test -f .vuepress/dist/index.html",
]
